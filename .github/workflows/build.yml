name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build the server
        run: dotnet build server/AgentMon.Server -c Release
      - name: Build the collector
        run: dotnet build collector/AgentMon.Collector -c Release
      - name: Check the gadget script
        run: node --check gadget/monitor.js
