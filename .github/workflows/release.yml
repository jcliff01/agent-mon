name: Release

# Push a tag such as v1.0.0 to test, build and publish ready-to-run downloads for Windows, macOS and
# Linux. The tag must match <Version> in Directory.Build.props, without the leading "v".
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match version $version"; exit 1; }
      - name: Run the tests
        run: dotnet test tests/AgentMon.Tests -c Release
      - name: Build downloads
        run: |
          mkdir -p dist
          for rid in win-x64 linux-x64 osx-arm64 osx-x64; do
            for app in server/AgentMon.Server collector/AgentMon.Collector; do
              dotnet publish "$app" -c Release -r "$rid" --self-contained true \
                -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
                -o "out/agent-mon-$GITHUB_REF_NAME-$rid"
            done
            cp README.md LICENSE "out/agent-mon-$GITHUB_REF_NAME-$rid/"
            (cd out && zip -qr "../dist/agent-mon-$GITHUB_REF_NAME-$rid.zip" "agent-mon-$GITHUB_REF_NAME-$rid")
          done
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --title "Agent Mon $GITHUB_REF_NAME"
          --notes "Download the zip for your system under Assets. Each holds the server, the collector and the dashboard; nothing else to install. See CHANGELOG.md for what changed."
