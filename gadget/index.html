<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent Mon — Live Connection</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <div>
      <h2>My Connection</h2>
      <small>Agent Mon</small>
    </div>
    <strong id="overall" role="status">Waiting for measurements</strong>
  </header>

  <!-- Shown when the page is opened from the Agent Mon server. A Finesse integration that calls
       window.AgentMon.render() hides it. The key is kept only for this browser tab. -->
  <form id="connect" class="connect" autocomplete="off">
    <label>Read key <input id="key" type="password" required minlength="32" spellcheck="false"></label>
    <label>Agent <select id="agent" disabled><option value="">Enter the key first</option></select></label>
    <button type="submit" id="connect-btn">Connect</button>
    <button type="button" id="disconnect-btn" hidden>Disconnect</button>
    <span id="connect-status" class="muted" role="status"></span>
  </form>

  <div id="targets" class="targets" aria-live="polite"></div>

  <section>
    <h3>Recent measurements</h3>
    <p id="freshness">No measurements received</p>
    <table>
      <thead><tr><th>Time</th><th>System</th><th>Status</th><th>Round trip</th></tr></thead>
      <tbody id="samples"></tbody>
    </table>
  </section>

  <p class="note">HTTPS request timing, not ICMP ping or call audio quality. Old measurements mean the collector stopped reporting, not necessarily that the network is down.</p>
  <script src="./monitor.js" defer></script>
</body>
</html>
